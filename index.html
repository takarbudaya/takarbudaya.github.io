<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TAKAR BUDAYA - Tata Kalkulasi Partisipasi Budaya</title>
  <meta name="description" content="Instrumen praktis penghitungan penonton (Metode Herbert Jacobs) dan pelaku seni / pendukung.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Cinzel:wght@700&display=swap" rel="stylesheet">
  <!-- Terapkan mode gelap/terang tersimpan sebelum render agar tidak berkedip -->
  <script>
    try {
      var t = localStorage.getItem('takar-theme');
      document.documentElement.dataset.theme = t === 'light' ? 'light' : 'dark';
    } catch (e) {
      document.documentElement.dataset.theme = 'dark';
    }
  </script>
</head>
<body>
  <div id="app"></div>
  <noscript>Aplikasi Takar Budaya membutuhkan JavaScript untuk berjalan.</noscript>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
